<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>無音カメラ</title>
<style>
body{margin:0;background:#000;height:100vh;display:flex;flex-direction:column}
video{flex:1;width:100%;min-height:0;object-fit:contain}
button{margin:16px auto;width:72px;height:72px;border-radius:50%;border:4px solid #fff;background:#fff3}
</style></head><body>
<video id="v" autoplay playsinline muted></video>
<button id="b"></button>
<script>
const v=document.getElementById('v');
navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}}).then(s=>v.srcObject=s);
document.getElementById('b').onclick=()=>{
 const c=document.createElement('canvas');
 c.width=v.videoWidth;c.height=v.videoHeight;
 c.getContext('2d').drawImage(v,0,0);
 c.toBlob(async b=>{
  const f=new File([b],'photo.jpg',{type:'image/jpeg'});
  try{await navigator.share({files:[f]});}catch(e){}
 },'image/jpeg',0.95);
};
</script></body></html>
